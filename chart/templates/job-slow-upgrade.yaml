# Holds every upgrade in pending-upgrade for 90 s, so the CDC can be killed mid-upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-slow-upgrade
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sleep
          image: busybox:1.36
          command: ["sleep", "90"]
